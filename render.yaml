services:
  - type: web
    name: wayfinder
    repo: https://github.com/Mao20Dev/wayfinder
    branch: main
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && npm ci --prefix frontend && npm run build --prefix frontend && python backend/manage.py collectstatic --noinput
    startCommand: gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 6 --timeout 180 --access-logfile -
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: NODE_VERSION
        value: 22.15.0
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: WEB_CONCURRENCY
        value: "1"
